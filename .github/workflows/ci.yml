name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tasks_ci
          POSTGRES_USER: tasks_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks_ci -d tasks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-key-not-for-production
      DEBUG: "False"
      DATABASE_URL: postgresql://tasks_ci:ci-only-password@localhost:5432/tasks_ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django System Check
        run: python manage.py check
      - name: Check for Missing Migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply Migrations
        run: python manage.py migrate --noinput
      - name: Run API and Unit Tests
        run: python manage.py test --verbosity 2

  docker-build:
    name: Validate Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose Configuration
        run: docker compose config --quiet
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: django-cicd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
